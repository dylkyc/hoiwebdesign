<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOI4 陆军编制设计器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">HOI4</span>
    <span class="brand-title">陆军编制设计器</span>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="tank">坦克设计</button>
    <button class="tab" data-view="designer">编制设计</button>
    <button class="tab" data-view="battle">战斗模拟</button>
    <button class="tab" data-view="leader">将领与技能</button>
    <button class="tab" data-view="data">数据浏览</button>
    <button class="tab" data-view="about">说明</button>
  </nav>
  <div class="meta" id="gameMeta">加载中…</div>
</header>

<main>

  <!-- ============ 坦克设计 ============ -->
  <section class="view active" id="view-tank">
    <div class="tank-layout">

      <aside class="panel">
        <div class="panel-head"><h2>底盘与科技解锁</h2></div>
        <div class="panel-body" id="tankChassis"></div>
      </aside>

      <div class="panel">
        <div class="panel-head"><h2>模块配置</h2></div>
        <div class="panel-body" id="tankSlots"></div>
      </div>

      <aside class="panel">
        <div class="panel-head"><h2>属性与导出</h2></div>
        <div class="panel-body" id="tankStats"></div>
      </aside>

    </div>
  </section>

  <!-- ============ 编制设计 ============ -->
  <section class="view" id="view-designer">
    <div class="div-layout">

      <div class="panel div-canvas">
        <div class="div-topbar">
          <div class="div-emblem" title="师徽">师</div>
          <input type="text" id="templateName" class="div-style-name" value="新编制" placeholder="师名">
          <div class="toolbar" style="flex:1 1 auto; flex-wrap:wrap; justify-content:flex-end">
            <button class="btn small" id="btnPreset">载入预设</button>
            <button class="btn small" id="btnClear">清空</button>
            <button class="btn small" id="btnSave">保存</button>
            <button class="btn small" id="btnLoad">读取</button>
            <button class="btn small" id="btnExport">导出 JSON</button>
            <button class="btn small" id="btnImport">导入 JSON</button>
          </div>
          <div class="div-topbar-right" id="selectionStatus"></div>
        </div>

        <div class="div-workbench">
          <div class="div-main">
            <div id="gridHost"></div>
          </div>
          <div class="div-side">
            <div class="slot-title">师级支援</div>
            <div id="supportHost" class="div-slot-col"></div>
          </div>
        </div>

        <div class="slot-title">团级支援（每个团需至少 3 个营）</div>
        <div class="reg-support-host">
          <div class="reg-support-spacer">师</div>
          <div id="regSupportHost" class="div-support-strip"></div>
        </div>

        <div id="validationHost" class="validation"></div>

        <!-- 兵种目录改成点空格弹出的选择窗；这两个宿主继续保留，供交互与自检使用 -->
        <div class="palette-holder" hidden>
          <input type="search" id="paletteSearch" placeholder="搜索单位…">
          <div id="paletteBody"></div>
        </div>
      </div>

      <aside class="panel">
        <div class="panel-head"><h2>师属性</h2></div>
        <div class="panel-body" id="statsBody"></div>
      </aside>

    </div>
  </section>

  <!-- ============ 战斗模拟 ============ -->
  <section class="view" id="view-battle">
    <div class="battle-layout">

      <aside class="panel">
        <div class="panel-head"><h2>战斗条件</h2></div>
        <div class="panel-body" id="battleConditions"></div>
      </aside>

      <div class="panel">
        <div class="panel-head"><h2>兵力与修正</h2></div>
        <div class="panel-body" id="battleResult"></div>
      </div>

      <aside class="panel">
        <div class="panel-head"><h2>地形对比</h2></div>
        <div class="panel-body" id="terrainCompare"></div>
      </aside>

    </div>
  </section>

  <!-- ============ 将领 ============ -->
  <section class="view" id="view-leader">
    <div class="leader-layout">
      <aside class="panel">
        <div class="panel-head"><h2>将领配置</h2></div>
        <div class="panel-body" id="leaderConfig"></div>
      </aside>
      <div class="panel">
        <div class="panel-head"><h2>效果预览</h2></div>
        <div class="panel-body" id="leaderPreview"></div>
      </div>
      <aside class="panel">
        <div class="panel-head"><h2>特质库</h2></div>
        <div class="panel-body" id="traitLibrary"></div>
      </aside>
    </div>
  </section>

  <!-- ============ 数据浏览 ============ -->
  <section class="view" id="view-data">
    <div class="panel">
      <div class="panel-head">
        <h2>游戏数据</h2>
        <nav class="subtabs" id="dataTabs">
          <button class="subtab active" data-sheet="battalions">战斗营</button>
          <button class="subtab" data-sheet="supports">支援连</button>
          <button class="subtab" data-sheet="regimental">团级支援</button>
          <button class="subtab" data-sheet="equipment">装备</button>
          <button class="subtab" data-sheet="terrain">地形</button>
          <button class="subtab" data-sheet="traits">将领特质</button>
          <button class="subtab" data-sheet="defines">战斗常数</button>
        </nav>
      </div>
      <div class="panel-body" id="dataBody"></div>
    </div>
  </section>

  <!-- ============ 说明 ============ -->
  <section class="view" id="view-about">
    <div class="panel">
      <div class="panel-head"><h2>说明与公式来源</h2></div>
      <div class="panel-body" id="aboutBody"></div>
    </div>
  </section>

</main>

<div id="toast" class="toast"></div>

<script src="data/bundle.js"></script>
<script src="js/engine/data.js"></script>
<script src="js/engine/division.js"></script>
<script src="js/engine/combat.js"></script>
<script src="js/engine/tank.js"></script>
<script src="js/ui/common.js"></script>
<script src="js/ui/designer.js"></script>
<script src="js/ui/battle.js"></script>
<script src="js/ui/leader.js"></script>
<script src="js/ui/tankdesign.js"></script>
<script src="js/ui/dataview.js"></script>
<script src="js/ui/about.js"></script>
<script src="js/app.js"></script>
</body>
</html>
